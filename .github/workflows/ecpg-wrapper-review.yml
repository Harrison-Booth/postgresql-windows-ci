name: Exact ECPG v2 required-wrapper control
on:
  workflow_dispatch:
    inputs:
      host_arch:
        description: Native runner architecture; target stays x64
        type: choice
        options: [x64, arm64]
        default: x64
        required: true
permissions:
  contents: read
concurrency:
  group: ecpg-required-wrapper-${{ inputs.host_arch }}
  cancel-in-progress: false
jobs:
  required-wrapper:
    if: ${{ github.repository == 'Harrison-Booth/postgresql-windows-ci' && !github.event.repository.private }}
    runs-on: ${{ inputs.host_arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: postgres/postgres
          ref: 8e82d6610e7280d7870c0c36ff1c797e3cfb3e09
          path: postgres
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ inputs.host_arch }}
      - name: Test exact original integration with required quoted Python wrapper
        shell: pwsh
        env:
          TEST_HOST_ARCH: ${{ inputs.host_arch }}
        run: ./ci/tools/hosted-ecpg-wrapper.ps1
      - name: Preserve all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecpg-required-wrapper-${{ inputs.host_arch }}
          retention-days: 3
          if-no-files-found: error
          path: |
            evidence/
            build-required/meson-logs/
            build-required/testrun/**/log/
            build-required/testrun/**/regression.diffs
            build-no-wrapper/meson-logs/
            cross-required.ini
            cross-missing.ini
            native-zic.ini
            native-tools/meson-logs/

            wrapper with spaces/invocations/
