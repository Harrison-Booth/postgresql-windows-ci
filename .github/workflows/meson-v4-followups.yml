name: CF7300 Meson v4 follow-up patches
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meson-v4-followups-current-38c3
  cancel-in-progress: false
jobs:
  review:
    if: ${{ github.repository == 'Harrison-Booth/postgresql-windows-ci' && !github.event.repository.private && github.ref == 'refs/heads/meson-followups-current-38c3' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: postgres/postgres
          ref: 38c3d87d43397ab600f085e398789f3dea1cd0a5
          path: postgres
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Run ordered patch series and native Windows checks
        shell: pwsh
        run: ./ci/tools/meson-followup-review.ps1 -Architecture '${{ matrix.arch }}'
      - name: Preserve results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-v4-followups-${{ matrix.arch }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
